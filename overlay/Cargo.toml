[package]
name = "bikemeter-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bikemeter-overlay"
path = "src/main.rs"

[dependencies]
# CSV parsing
csv = "1.3"
# Serialization
serde = { workspace = true, features = ["derive"] }
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }
# Image processing
image = "0.25"
# Error handling
anyhow = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Progress bars
indicatif = "0.17"

[features]
default = []
video = []
