[package]
name = "bikemeter-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Hardware Abstraction Layer for RP2350/Pico 2
rp235x-hal = { version = "0.3", features = ["critical-section-impl", "rt", "defmt"] }
# Embassy embedded framework for RP chips
embassy-rp = { version = "0.9", features = ["defmt", "rp235xa", "time-driver"] }
embassy-time = { version = "0.4", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-executor = { version = "0.7", features = ["defmt", "task-arena-size-65536", "arch-cortex-m", "executor-thread"] }
# BNO055 IMU sensor driver
bno055 = "0.2"
# SD card FAT filesystem (no_std compatible)
embedded-sdmmc = { version = "0.8" }
# Hardware abstraction traits
embedded-hal = "1.0"
embedded-hal-async = "1.0"
# Static data structures
heapless = "0.8"
# Panic handler - defmt
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
# Critical section - use restore-state-bool to match cortex-m requirement
critical-section = { version = "1.2", features = ["restore-state-bool"] }
# Futures
futures = { version = "0.3", default-features = false }
# Cortex-M runtime
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

# Metadata for probe-rs/cargo-embed
[package.metadata.probe]
chip = "RP2350"
protocol = "SWD"

[package.metadata.probe.flashing]
enabled = true

[package.metadata.cargo-embed]
chip = "RP2350"
