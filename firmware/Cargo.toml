[package]
name = "bikemeter-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bikemeter_firmware"
test = true

[[bin]]
name = "bikemeter-firmware"
path = "src/main.rs"
test = false

[dependencies]
# Shared deps (work on both host and embedded)
heapless = "0.8"
libm = "0.2"

# Embedded-only deps -- only compiled for ARM bare-metal targets
[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
embassy-rp = { version = "0.3", features = ["defmt", "rp235xa", "time-driver"] }
embassy-time = { version = "0.4", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-executor = { version = "0.7", features = ["defmt", "task-arena-size-65536", "arch-cortex-m", "executor-thread"] }
embassy-sync = { version = "0.6", features = ["defmt"] }
bno055 = { git = "https://github.com/eupn/bno055" }
embedded-sdmmc = "0.8"
embedded-hal = "1.0"
embedded-hal-bus = "0.2"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
critical-section = { version = "1.2", features = ["restore-state-bool"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

# Metadata for probe-rs/cargo-embed
[package.metadata.probe]
chip = "RP2350"
protocol = "SWD"

[package.metadata.probe.flashing]
enabled = true

[package.metadata.cargo-embed]
chip = "RP2350"
